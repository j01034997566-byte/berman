<rect x="24" y="286" width="312" height="250" rx="22" fill="white"/><text x="44" y="324" class="body b">택시 이용 내역</text><text x="44" y="354" class="small muted">서울역 → 강남역</text><path d="M44 374h272" stroke="#eef0f6"/><text x="44" y="407" class="body muted">전체 이용 금액</text><text x="316" y="407" text-anchor="end" class="body b">18,000원</text><text x="44" y="443" class="body muted">함께 나눈 인원</text><text x="316" y="443" text-anchor="end" class="body b">2명</text><path d="M44 463h272" stroke="#eef0f6"/><text x="44" y="501" class="body b">내가 낸 금액</text><text x="316" y="505" text-anchor="end" class="title purple">9,000원</text><text x="180" y="570" text-anchor="middle" class="small muted">금액과 이용 내역은 이해를 돕기 위한 예시입니다.</text><rect x="24" y="606" width="312" height="56" rx="16" fill="#473bf0"/><text x="180" y="641" text-anchor="middle" class="body b white">정산 내역 확인</text><rect x="123" y="700" width="114" height="5" rx="3" fill="#192038"/></svg>